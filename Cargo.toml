[package]
name = "beat-saber-mapping-extractor"
version = "0.7.0"
edition = "2021"
description = "Desktop Beat Saber map converter and raw Unity bundle exporter"
publish = false

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["ico"] }
open = "5"
rfd = "0.15.4"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
