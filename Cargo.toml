[package]
name = "beat-saber-mapping-extractor"
version = "1.0.0"
edition = "2021"
description = "One-step Beat Saber Unity bundle asset extraction"
publish = false

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "webp"] }
open = "5"
rfd = "0.15.4"
tempfile = "3"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
unity-rs-core = "=0.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
